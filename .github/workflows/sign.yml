name: Build & Sign APK

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Artifact suffix (e.g. signed)'
        default: 'signed'
        required: false

env:
  KEY_ALIAS: yihan
  STORE_PASSWORD: Yihan2026!
  KEY_PASSWORD: Yihan2026!
  DN: 'CN=Yihan, OU=Dev, O=YihanAntidetect, L=Shanghai, ST=Shanghai, C=CN'

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Debug APK (Obfuscated)
      run: ./gradlew assembleDebug
    
    - name: Build Release APK (Obfuscated, Unsigned)
      run: ./gradlew assembleRelease
    
    - name: List APK outputs
      run: |
        echo "=== Debug APK ==="
        ls -lh app/build/outputs/apk/debug/
        echo "=== Release APK ==="
        ls -lh app/build/outputs/apk/release/
    
    # ---- 从 GitHub Secrets 解码 keystore ----
    - name: Decode keystore from secret
      env:
        KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      run: |
        if [ -z "$KEY_BASE64" ]; then
          echo "::error:: SIGNING_KEY_BASE64 secret is not set. Please add it in repo Settings → Secrets."
          exit 1
        fi
        echo "$KEY_BASE64" | base64 -d > signing.ks
        echo "::add-mask::signing.ks"
        ls -lh signing.ks
    
    # ---- 对 release APK 进行签名 ----
    - name: Sign Release APK with apksigner
      env:
        KEYSTORE_FILE: app/build/outputs/apk/release/app-release-unsigned.apk
        OUTPUT_FILE: app/build/outputs/apk/release/app-release-signed-aligned.apk
      run: |
        if [ ! -f "$KEYSTORE_FILE" ]; then
          echo "::error:: Release APK not found at $KEYSTORE_FILE"
          exit 1
        fi
        # 用 apksigner 签名（自动对齐）
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks signing.ks \
          --ks-key-alias $KEY_ALIAS \
          --ks-pass env:STORE_PASSWORD \
          --key-pass env:KEY_PASSWORD \
          --out "$OUTPUT_FILE" \
          "$KEYSTORE_FILE"
        echo "✓ Release APK signed successfully"
        ls -lh "$OUTPUT_FILE"
    
    - name: Verify release APK signature
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v app/build/outputs/apk/release/app-release-signed-aligned.apk
    
    - name: Rename signed release APK
      run: |
        mv app/build/outputs/apk/release/app-release-signed-aligned.apk \
           app/build/outputs/apk/release/app-release.apk
        echo "✓ Renamed to app-release.apk"
        ls -lh app/build/outputs/apk/release/
    
    # ---- 对 debug APK 也签名（方便测试） ----
    - name: Sign Debug APK with apksigner
      env:
        DEBUG_APK: app/build/outputs/apk/debug/app-debug.apk
        DEBUG_SIGNED: app/build/outputs/apk/debug/app-debug-signed.apk
      run: |
        if [ ! -f "$DEBUG_APK" ]; then
          echo "::warning:: Debug APK not found"
          exit 0
        fi
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks signing.ks \
          --ks-key-alias $KEY_ALIAS \
          --ks-pass env:STORE_PASSWORD \
          --key-pass env:KEY_PASSWORD \
          --out "$DEBUG_SIGNED" \
          "$DEBUG_APK"
        echo "✓ Debug APK signed"
        ls -lh "$DEBUG_SIGNED"
        mv "$DEBUG_SIGNED" "$DEBUG_APK"
    
    - name: Verify debug APK signature
      run: |
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v app/build/outputs/apk/debug/app-debug.apk
    
    # ---- 清理 keystore ----
    - name: Cleanup keystore
      run: |
        rm -f signing.ks
        echo "✓ Keystore cleaned up"
    
    # ---- 上传 artifacts ----
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
    
    # ---- 创建 GitHub Release ----
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.1.0-${{ github.run_number }}
        name: Release v1.1.0 Build ${{ github.run_number }}
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        body: |
          ## YH v1.1.0
          
          ### 功能
          - 一键伪装设备信息
          - 运行时伪装（无需重启）
          - 设备状态查看
          - 云手机/模拟器特征清理
          
          ### 安全特性
          - R8 代码混淆（完整的符号/代码混淆）
          - APK 签名验证（v1/v2/v3）
          
          ### 下载
          - `app-debug.apk` - 调试版本（已签名）
          - `app-release.apk` - 发布版本（已签名+混淆）
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}